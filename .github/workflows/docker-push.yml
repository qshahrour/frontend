name: Build and Push Docker Images

on:
  push:
    branches:
      - develop

env:
  AWS_REGION: eu-central-1
  FRONTEND_REPO: frontend
  BUILDX_VERSION: latest
  BUILDX_IMAGE: frontend
  IMAGE_TAG: ${{ github.sha }}
  ECR_REPOSITORY: frontend
  ECR_REGISTRY: '907244240513.dkr.ecr.eu-central-1.amazonaws.com'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v3
    
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔑 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      #- name: Build, tag, and push image to Amazon ECR
      #  id: build-image
        #env:
          #ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      #  run: |
      #   docker build -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} .
      #    docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
      #    echo "image=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            images: ${{ env.ECR_REGISTRY }}/${{ env.BUILDX_IMAGE }},enable=true
          tags: |
            type=semver,pattern={{version}},value=${{ env.BUILDX_VERSION }}

      - name: 🐳 Docker Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          platforms: linux/amd64,linux/arm64/8
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          #build-args: |
          #  TARGETPLATFORM=${{ env.TARGETPLATFORM }}
          #  BUILD_DATE=$(date +%s)
