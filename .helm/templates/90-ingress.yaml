---
{{- $host := (.Values.app.url }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    #nginx.ingress.kubernetes.io/whitelist-source-range: {{ join "," (pluck .Values.env .Values.app.whitelist | first | default .Values.app.whitelist._default ) }}
    #nginx.ingress.kubernetes.io/enable-cors: "true"
    #nginx.ingress.kubernetes.io/cors-allow-origin: {{ (pluck .Values.env .Values.app.cors | first | default .Values.app.cors._default) | quote }}
spec:
  ingressClassName: {{ .Values.app.ingressClass }}
  rules:
  - host: {{ $host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Chart.Name }}
            port:
              name: http 
