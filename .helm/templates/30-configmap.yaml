---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-nginx-config
data:
  nginx.conf: |
    user nginx;
    error_log  /dev/stderr;
    pid /run/nginx.pid;
    worker_processes 2;
    worker_rlimit_nofile 4096;

    events {
      worker_connections 10000;
      multi_accept on;
    }

    http {
      set_real_ip_from 0.0.0.0/0;

      # proxy_cache_path /cache keys_zone=static:100m;

      charset utf-8;
      sendfile on;
      tcp_nopush on;
      tcp_nodelay on;
      server_tokens off;
      log_not_found off;
      types_hash_max_size 2048;
      client_max_body_size 128M;

      keepalive_timeout 65;
      client_body_timeout 20;
      send_timeout 10;

      # MIME
      include mime.types;
      default_type application/octet-stream;

      map $http_x_forwarded_proto $thescheme {
          default $scheme;
          https https;
          http http;
      }

      # logging
      log_format combined_plus '{ "ip": "$remote_addr", "http_user": "$remote_user", "request_id": "$request_id", "time": "$time_local",'
        ' "method": "$request_method", "uri": "$thescheme://$http_host$request_uri", "protocol": "$server_protocol", "status": "$status", "body_size": "$body_bytes_sent", "referrer": "$http_referer", '
        ' "user_agent": "$http_user_agent", "request_time": "$request_time", "cache_status": "$upstream_cache_status",'
        ' "upstream_response_time": "$upstream_response_time", "upstream_addr": "$upstream_addr", "upstream_status": "$upstream_status", "upstream_response_length": "$upstream_response_length", "rewrited": "$uri$is_args$args", "redirect": "$sent_http_location", "location": "$log_location"}';

      large_client_header_buffers 8 16k;
      client_header_buffer_size 4k;
      client_body_buffer_size 256k;

      server {
        listen 80 default_server;
        access_log /dev/stdout combined_plus;
        root /var/www/html;
        
        location / {
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location ~* "^\/_tech\/ngx-status$" {
          stub_status;
          set $log_location "tech-nginx";
          access_log off;
          allow 127.0.0.1;
          allow 10.0.0.0/8;
          deny all;
        }
      }
    }
