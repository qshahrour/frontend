{{- if ( .Values.app.hpa.enabled | dig .Values.env .Values.app.hpa.enabled._default ) }}
---
kind: HorizontalPodAutoscaler
apiVersion: autoscaling/v2
metadata:
  name: {{ .Chart.Name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Chart.Name }}
  minReplicas: {{ pluck .Values.env .Values.app.hpa.replicas.min | first | default .Values.app.hpa.replicas.min._default }}
  maxReplicas: {{ pluck .Values.env .Values.app.hpa.replicas.max | first | default .Values.app.hpa.replicas.max._default }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ pluck .Values.env .Values.app.hpa.averageValue | first | default .Values.app.hpa.averageValue._default }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
{{- end }}
