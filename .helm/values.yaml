app:
  hpa:
    enabled:
      _default: true
    replicas:
      min:
        _default: 1
      max:
        _default: 3
    averageValue: #cpu
      _default: 80
  ingressClass:
    _default: nginx
  url:
    dev: qasem1.balouli.com
    production:
  whitelist:
    _default:
      - "0.0.0.0/0"
  image: 907244240513.dkr.ecr.eu-central-1.amazonaws.com/frontend

resources:
  app:
    _default:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 128Mi
