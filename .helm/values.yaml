app:
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    averageValue: 80
  ingressClass:
    _default: alb
  url:
    dev: qasem1.balouli.com
  whitelist:
    _default:
      - "0.0.0.0/0"
  image: 907244240513.dkr.ecr.eu-central-1.amazonaws.com/frontend:latest
  env: dev

resources:
  app:
    _default:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 128Mi
